[package]
name = "awan-host-remote"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Native Rust UI preview for Awan Host Remote"
publish = false

[dependencies]
# Individual tree-sitter-* grammars instead of the "tree-sitter-languages"
# umbrella: that bundle pulls in tree-sitter-sql (via tree-sitter-sequel),
# whose build pins `cc = "~1.2.1"`, conflicting with the newer `cc` ring/russh
# already resolve to. SQL highlighting is dropped; everything else is kept.
gpui-kit = { version = "0.7", features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cmake", "tree-sitter-cpp",
    "tree-sitter-csharp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-elixir",
    "tree-sitter-go", "tree-sitter-graphql", "tree-sitter-html", "tree-sitter-java",
    "tree-sitter-javascript", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-make",
    "tree-sitter-markdown", "tree-sitter-php", "tree-sitter-proto", "tree-sitter-python",
    "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-svelte",
    "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript",
    "tree-sitter-yaml", "tree-sitter-zig",
] }
alacritty_terminal = "0.25.1"
parking_lot = "0.12"
anyhow = "1.0"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1.48", features = ["rt", "net", "time", "sync", "macros"] }
zeroize = "1.8"

# Saved SSH logins on Linux go to the desktop keyring (GNOME Keyring / KWallet)
# over the freedesktop Secret Service D-Bus API. The async-io runtime keeps
# zbus off Tokio, so its blocking calls are safe inside the SSH session runtime.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4.0", features = ["rt-async-io-crypto-rust"] }

[package.metadata.deb]
name = "awan-host-remote"
maintainer = "Awan <awan@awandigitals.com>"
copyright = "Awan Digitals"
extended-description = "Native Rust desktop app to connect to and manage Linux servers over SSH."
section = "net"
priority = "optional"
depends = "$auto, libvulkan1, libxkbcommon-x11-0, libwayland-client0, libfontconfig1"
recommends = "gnome-keyring | kwalletmanager, mesa-vulkan-drivers"
assets = [
    ["target/release/awan-host-remote", "usr/bin/", "755"],
    ["packaging/linux/awan-host-remote.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/pixmaps/awan-host-remote.png", "644"],
]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
